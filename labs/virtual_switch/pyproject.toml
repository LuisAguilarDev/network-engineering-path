[project]
name = "vswitch"
version = "1.0.0"
description = "A software Layer 2 switch built on scapy, for CCNA study"
requires-python = ">=3.11"
dependencies = ["scapy==2.6.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/"]
